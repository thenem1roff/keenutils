name: Installer checks
on:
  push:
    paths:
      - install
      - .github/workflows/installer-check.yml
  pull_request:
    paths:
      - install
      - .github/workflows/installer-check.yml
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX shell syntax
        run: sh -n install
      - name: ShellCheck errors
        run: shellcheck --severity=error --shell=sh install
      - name: Menu smoke test
        run: |
          sudo mkdir -p /opt/bin /opt/etc
          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/bin/opkg >/dev/null
          sudo chmod +x /opt/bin/opkg
          printf '00\n' | script -q -c 'sudo sh ./install' /dev/null | grep -q 'Выход.'
