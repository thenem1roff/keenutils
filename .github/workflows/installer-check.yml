name: Installer checks
on:
  push:
    paths:
      - install
      - torr_watchdog
      - torrserver
      - .github/workflows/installer-check.yml
  pull_request:
    paths:
      - install
      - torr_watchdog
      - torrserver
      - .github/workflows/installer-check.yml
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX shell syntax
        run: sh -n install && sh -n torr_watchdog && sh -n torrserver
      - name: ShellCheck errors
        run: shellcheck --severity=error --shell=sh install torr_watchdog torrserver
      - name: Menu smoke test
        run: |
          sudo mkdir -p /opt/bin /opt/etc
          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/bin/opkg >/dev/null
          sudo chmod +x /opt/bin/opkg
          printf '00\n' | script -q -c 'sudo sh ./install' /dev/null | grep -q 'Выход.'
      - name: KeenUtils installs persistent launcher and works offline
        run: |
          set -eu
          test -x /opt/bin/keenutils
          sh -n /opt/bin/keenutils
          printf '00\n' |
            script -q -c 'sudo /opt/bin/keenutils' /dev/null > /tmp/keenutils-command.log
          grep -q 'Выход.' /tmp/keenutils-command.log
          grep -q '88. Обновить KeenUtils' /tmp/keenutils-command.log
      - name: KeenUtils self-update and no-op update
        run: |
          set -eu
          cp ./install /tmp/keenutils-ci-source
          printf '\n# old-version-for-test\n' | sudo tee -a /opt/bin/keenutils >/dev/null
          cat <<'MOCK_WGET' | sudo tee /opt/bin/wget >/dev/null
          #!/bin/sh
          [ "$1" = -q ] && [ "$2" = -O ] || exit 1
          cp /tmp/keenutils-ci-source "$3"
          MOCK_WGET
          sudo chmod 755 /opt/bin/wget
          # Choose 88, accept default Yes, Enter to restart, then 00 exits.
          printf '88\n\n\n00\n' |
            script -q -c 'sudo /opt/bin/keenutils' /dev/null > /tmp/keenutils-updated.log
          grep -q 'KeenUtils успешно обновлён' /tmp/keenutils-updated.log
          grep -q 'Выход.' /tmp/keenutils-updated.log
          cmp -s /tmp/keenutils-ci-source /opt/bin/keenutils
          grep -q 'old-version-for-test' /opt/bin/keenutils.backup
          # Running the same update again must not rewrite the installation.
          printf '88\n\n\n00\n' |
            script -q -c 'sudo /opt/bin/keenutils' /dev/null > /tmp/keenutils-noop.log
          grep -q 'уже актуален' /tmp/keenutils-noop.log
          grep -q 'Выход.' /tmp/keenutils-noop.log
          cmp -s /tmp/keenutils-ci-source /opt/bin/keenutils
      - name: TorrServer submenu navigation and independent actions
        run: |
          set -eu
          # 7 opens submenu; 0 goes straight back; 00 exits main menu.
          printf '7\n0\n00\n' |
            script -q -c 'sudo sh ./install' /dev/null > /tmp/torr-menu.log
          grep -q 'TorrServer | Управление' /tmp/torr-menu.log
          grep -q '4. Настроить кеш TorrServer' /tmp/torr-menu.log
          grep -q 'Выход.' /tmp/torr-menu.log
          # Updating a missing TorrServer must not trigger installation.
          printf '7\n2\n\n0\n00\n' |
            script -q -c 'sudo sh ./install' /dev/null > /tmp/torr-update-absent.log
          grep -q 'TorrServer не установлен' /tmp/torr-update-absent.log
          grep -q 'Выход.' /tmp/torr-update-absent.log
          # Cache configuration is an independent menu action.
          printf '7\n4\n\n0\n00\n' |
            script -q -c 'sudo sh ./install' /dev/null > /tmp/torr-cache-absent.log
          grep -q 'TorrServer не установлен' /tmp/torr-cache-absent.log
          grep -q 'Выход.' /tmp/torr-cache-absent.log
      - name: Watchdog existing installation and repair smoke tests
        run: |
          set -eu
          sudo mkdir -p /opt/etc/init.d /opt/bin
          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/bin/torr_watchdog.sh >/dev/null
          sudo chmod 755 /opt/bin/torr_watchdog.sh
          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/etc/init.d/S10cron >/dev/null
          printf '#!/bin/sh\nexit 0\n' | sudo tee /opt/etc/init.d/S90torrserver >/dev/null
          sudo chmod 755 /opt/etc/init.d/S10cron /opt/etc/init.d/S90torrserver
          printf '* * * * * root /opt/bin/torr_watchdog.sh\n* * * * * root sleep 30 && /opt/bin/torr_watchdog.sh\n' | sudo tee /opt/etc/crontab >/dev/null
          before="$(sha256sum /opt/etc/crontab | cut -d ' ' -f 1)"
          sudo sh ./torr_watchdog | grep -q 'уже установлен'
          after="$(sha256sum /opt/etc/crontab | cut -d ' ' -f 1)"
          test "$before" = "$after"
          test "$(cat /opt/bin/torr_watchdog.sh)" = "$(printf '#!/bin/sh\nexit 0')"
          # Existing cron without a trailing newline must be repaired safely.
          printf '* * * * * root /opt/bin/torr_watchdog.sh' | sudo tee /opt/etc/crontab >/dev/null
          sudo sh ./torr_watchdog | grep -q 'Проверка успешна'
          test "$(grep -Fxc '* * * * * root /opt/bin/torr_watchdog.sh' /opt/etc/crontab)" = 1
          test "$(grep -Fxc '* * * * * root sleep 30 && /opt/bin/torr_watchdog.sh' /opt/etc/crontab)" = 1
          test "$(cat /opt/bin/torr_watchdog.sh)" = "$(printf '#!/bin/sh\nexit 0')"
          repaired="$(sha256sum /opt/etc/crontab | cut -d ' ' -f 1)"
          sudo sh ./torr_watchdog | grep -q 'уже установлен'
          test "$repaired" = "$(sha256sum /opt/etc/crontab | cut -d ' ' -f 1)"
